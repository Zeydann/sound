plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zeyy.instants'
    compileSdk 34

    defaultConfig {
        applicationId "com.zeyy.instants"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed keystore so every build has the same signature and
    // new releases install over the old one without uninstalling.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
