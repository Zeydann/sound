name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "Instants-$TAG.apk"
          gh release create "$TAG" "Instants-$TAG.apk" \
            --title "Instants $TAG" \
            --notes "Unofficial personal wrapper for myinstants.com. All sounds and content belong to myinstants.com and its uploaders."
